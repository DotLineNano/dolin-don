[package]
name = "dolin"
version = "2.0.1"
edition = "2021"
license = "BSD-3-Clause"
description = "Dolin archive format (.don) in Rust"

[lib]
name = "dolin"
path = "src/lib.rs"

[[bin]]
name = "dolin"
path = "src/main.rs"

[dependencies]
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
rayon = "1.10"
miniz_oxide = "0.8"
