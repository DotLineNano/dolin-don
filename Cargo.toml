[package]
name = "dolin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Dolin archive format (.don) in Rust"

[lib]
name = "dolin"
path = "src/lib.rs"

[[bin]]
name = "dolin"
path = "src/main.rs"

[dependencies]
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
